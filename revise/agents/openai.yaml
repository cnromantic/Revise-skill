display_name: Revise
short_description: Thesis review, conservative revision, Word/PDF annotation, reference verification, and batch summaries
default_prompt: >
  Use Revise to process the undergraduate thesis files in the current folder.
  Generate a revised file, a revision report in Markdown, and a revision report in PDF.
  For Word files, copy the source first, edit only the copy, and highlight revisions in yellow.
  For PDF files, create a nearby-annotation revised PDF.
  If the same thesis has both Word and PDF versions, process the Word version by default and record that the PDF was skipped.
  Check reference order, reference authenticity, and citation correctness by default.
  If network or database access is unavailable, list unverified references truthfully and do not invent DOI, URL, volume, issue, page, or publication data.
